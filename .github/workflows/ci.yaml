name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: MizuchiLabs/.github/.github/workflows/go-ci.yaml@main
    # GO-2026-6508 in otel otlploggrpc, the fix needs a traefik release that supports otel log v0.21.
    with:
      vulncheck: false

  # Skips itself for repos without kos in .goreleaser.yaml.
  nightly:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: MizuchiLabs/.github/.github/workflows/go-nightly.yaml@main
