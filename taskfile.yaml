version: "3"

env:
  IMAGE: ghcr.io/mizuchilabs/tetherd

tasks:
  dev:
    desc: Run development server
    cmds:
      - go run . --token 123

  update:
    desc: Update dependencies
    cmds:
      # Direct deps only. `go get -u` raises indirect deps past what traefik builds with,
      # this way they only move as far as traefik or another direct dep asks for.
      - go get $(go mod edit -json | jq -r '.Require[] | select(.Indirect | not) | .Path + "@latest"')
      - go mod tidy

  build:
    desc: Build binary
    cmds:
      - go build -ldflags="-s -w" -trimpath -o tetherd

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
      - docker tag goreleaser.ko.local:latest $IMAGE:nightly
      - grype $IMAGE:nightly

  snapshot:push:
    desc: Build and push snapshot to registry
    deps: [snapshot]
    cmds:
      - docker push $IMAGE:nightly
